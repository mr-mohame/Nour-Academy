<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Nour Academy</title>
</head>
<body class="bg-blanc font-titre m-0 p-0 box-border">
    <!-- header page -->
    <header>
        <nav class="bg-Bleu-nuit h-16 text-picker relative">
            <div class="max-w-9xl mx-auto h-full flex justify-between items-center relative">
                <a href="#Accueil" class="flex item-center h-full">
                     <img src="img/logo.webp" alt="logo de nour academy" class="h-full w-auto ">
                </a>
                
                <input type="checkbox" id="menu-tag" class="peer hidden">
                
                
                <div class="flex items-center  gap-4 md:order-last h-full md:m-6">
                    <button id="btn" class="bg-blanc px-3 py-1 border-green-cyan rounded-[10px] text-xl flex items-center gap-1 cursor-pointer ">
                        <span>🛒</span> Panier
                    </button>
                </div>
               
                <label for="menu-tag" class=" text-blanc md:hidden cursor-pointer flex flex-col justify-center gap-1 z-50 text-5xl">☰</label>
                <ul class="hidden peer-checked:block absolute top-full left-0 w-full bg-Bleu-nuit text-blanc p-5 m-0 flex-col gap-5 md:static md:flex md:flex-row md:w-auto md:p-4">
                    <li><a href="#Accueil" class="hover:text-red">Accueil</a></li>
                    <li><a href="#Formations"  class="hover:text-red">Formations</a></li>
                    <li><a href="#Pourquoi-nous"  class="hover:text-red">Pourquoi nous</a></li>
                </ul>  
                  
            </div>           
        </nav>
    </header>
    <!-- main -->
    <main class="bg-blanc m-0 p-0 ">
        <!-- section de formation -->
           <!--section de titer-->
         <!-- <section class="font-texte text-[25px] font-bold p-5 m-0">
                <h2>Nos formations</h2>
         </section> -->
           <!--section de filter-->         
         <!-- <section>


         </section> -->
           <!--section de nos formation-->          
        <section id="formation" class="bg-[#FAF7ED] py-1 px-2 m-0 border-slate-200">
            <div id="container" class="p-3 m-0 w-full max-w-7xl mx-auto">
                <h2 class="font-texte text-[25px] font-bold">Nos formations</h2>
                <p class="font-texte font-normal text-sm md:text-base text-gris-secondaire">Trouvez le cours adapté au niveau et aux besoins de votre enfant.</p>
                <div id="filter" class=" bg-blanc flex flex-col md:flex-row my-3 gap-3 font-texte font-bold text-sm text-ardoise">
                    <div class="border border-green-cyan rounded-xl cursor-pointer w-full md:1/2 flex-1">
                        <select class="w-full p-4" name="chose_course" id="niveau-select" required>
                            <option value="" placeholder>Choisir le niveau</option>
                            <option value="Primaire">Primaire</option>
                            <option value="College">College</option>
                            <option value="Lycee">Lycee</option>    
                        </select>
                    </div>

                    <div class="border border-green-cyan rounded-xl cursor-pointer w-full md:1/2 flex-1">
                        <select class="w-full p-4" name="chose_course" id="matieres-select" required>
                            <option value="" placeholder>Choisir la matière</option>
                            <option value="Mathematiques">Mathematiques</option>
                            <option value="Physique-Chimie">Physique-Chimie</option>
                            <option value="SVT">SVT</option>
                            <option value="Francais">Francais</option>
                            <option value="Arabe">Arabe</option>
                            <option value="Anglais">Anglais</option>
                            <option value="Informatique">Informatique</option>
                            <option value="Philosophie">Philosophie</option>
                            <option value="Geographie">Geographie</option>
                            <option value="Islamique">Islamique</option>
                            <option value="Economie">Economie</option>
                            <option value="Comptabilite">Comptabilite</option>    
                        </select>
                    </div>
                </div>
            </div>
        </section>
    
    
     </main>
      <script src="script.js"></script> 
</body>
</html>
